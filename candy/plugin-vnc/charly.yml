version: 2026.232.0520
plugin-vnc:
    candy:
        version: 2026.178.1200
        description: |-
            OUT-OF-TREE charly plugin serving the `vnc` RFB/VNC check verb — a standalone
            Go module (go.mod + main.go) that drives a live deployment's VNC desktop over
            the RFB protocol (RFC 6143: the custom stdlib-only VNC client — VeNCrypt/TLS +
            ZRLE decode), served OUT-OF-PROCESS over go-plugin gRPC via the charly plugin
            SDK (github.com/opencharly/sdk). charly's loader fetches this candy's repo, go-builds the
            provider binary on the HOST, and serves it via LocalTransport — so the RFB client
            lives HERE, out of charly's core check surface (the latest external dep-shed after
            candy/plugin-cdp; nothing VNC-specific remains in core — the former `charly check
            vnc vm` CLI is subsumed into the declarative `vnc:` verb against a vm target).
            Since the schema-compaction cutover an authored `vnc:` step desugars to the
            internal plugin/plugin_input envelope, and every vnc-exclusive modifier
            (method/x/y/text/key/artifact/http_method/params) lives in the plugin's OWN
            #VncInput (schema/vnc.cue); the verb dispatches through the provider registry
            exactly like a built-in
            (ResolveVerb → grpcProvider → invokeVerbProvider hands it the full #Op). The plugin
            resolves the deployment's VNC endpoint via the generic cc.ResolveGraphicsEndpoint
            reverse-leg (the host owns the podman / venue / libvirt / port-mapping machinery) —
            a container's published port 5900, or a VM's libvirt-discovered <graphics type='vnc'>
            listener bridged/tunneled to a host-reachable TCP address — plus the resolved
            password, so this plugin needs no container inspection at all. Provides status/screenshot/click/mouse/
            type/key/rfb/session (session = the host-side detached RFB framebuffer recorder over the runner's
            generic background-session service, Cutover E E-1). The R10 consumer is a wayvnc-bearing pod bed whose check composes this
            plugin (e.g. sway-browser-vnc via sway-desktop-vnc).
        plugin:
            source: github.com/opencharly/plugin-vnc/candy/plugin-vnc
            providers:
                - verb:vnc
        plan:
            - check: the vnc verb dispatches through the provider registry and reports the VNC server status on a live desktop deployment with a wayvnc endpoint (the out-of-process plugin verb dials the host-resolved RFB address)
              id: vnc-verb-dispatches
              vnc: status
              stdout:
                - contains: ok
              eventually: 60s
              retry_interval: 5s
              context:
                - runtime
            - check: the vnc session method starts a HOST-side detached RFB capture recorder against the live desktop's wayvnc endpoint (framebuffer polling at fps into MJPEG through the runner's generic background-session service)
              id: vnc-session-start
              vnc:
                method: session
                action: start
                session_id: ade-vnc-session
                fps: 2
              stdout:
                - contains: started
              context:
                - runtime
            - check: the vnc session status reports the detached recorder alive
              id: vnc-session-status
              vnc:
                method: session
                action: status
                session_id: ade-vnc-session
              stdout:
                - contains: alive=true
              context:
                - runtime
            - check: the vnc session stop finalizes the detached recorder and its evidence row (frames.mjpeg + row.json)
              id: vnc-session-stop
              vnc:
                method: session
                action: stop
                session_id: ade-vnc-session
              stdout:
                - contains: stopped
              context:
                - runtime
